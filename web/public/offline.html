<!doctype html>
<!--
  Served by app-sw.js when a page load can't reach Tether. It stands alone (no app bundle, nothing
  else cached), so its few styles are inline, matching the app's dark neutral theme. It reloads by
  itself once Tether answers again.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>Tether · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #1b1b1b;
        color: #ffffff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
        max-width: 320px;
        padding: 32px 24px;
        border-radius: 16px;
        background: #262626;
      }
      svg {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 18px;
        font-weight: 650;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        color: #a3a3a3;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #a3a3a3;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #7c9cff;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
      button {
        margin-top: 8px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: #1b1b1b;
        background: #f1f1f1;
        border: 0;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#7c9cff" />
        <text x="16" y="22" font-size="18" text-anchor="middle" font-family="sans-serif" font-weight="800" fill="#0b0c0e">t</text>
      </svg>
      <h1>Offline — reconnecting…</h1>
      <p>Tether can't be reached right now. Your agents keep running on your machines; this page comes back on its own once you're online.</p>
      <div class="status" role="status"><span class="dot"></span><span id="status">Waiting for a connection</span></div>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      // Reload once the app answers. navigator.onLine can be true with no real connection (and false
      // positives the other way), so poll the page itself too, backing off to every 15 seconds.
      const status = document.getElementById("status");
      let delay = 2000;
      let timer;
      async function check() {
        clearTimeout(timer);
        status.textContent = "Checking…";
        try {
          const r = await fetch(location.pathname + location.search, { cache: "no-store", redirect: "manual" });
          // Any real answer (even a sign-in redirect) means we're back.
          if (r.type === "opaqueredirect" || r.status < 500) return location.reload();
        } catch {}
        status.textContent = navigator.onLine ? "Can't reach Tether yet" : "Waiting for a connection";
        timer = setTimeout(check, delay);
        delay = Math.min(15000, delay * 1.5);
      }
      window.addEventListener("online", () => ((delay = 2000), check()));
      document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && check());
      document.getElementById("retry").addEventListener("click", () => ((delay = 2000), check()));
      timer = setTimeout(check, delay);
    </script>
  </body>
</html>
